# Publishes the browser demo to GitHub Pages on every push to main.
# Mock mode: the frontend runs entirely on sample data, so no backend, no
# secrets and no API keys are involved. Built output is never committed —
# it's produced here and handed straight to Pages.
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you redeploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          VITE_USE_MOCK: "true" # sample content; there is no backend to call
          VITE_DEMO: "true" # shows the Demo plaque
          VITE_BASE: /${{ github.event.repository.name }}/ # served from a subpath

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
